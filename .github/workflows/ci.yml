# Runs on every pull request to main: lint, typecheck, unit tests, a production
# build, and the Playwright end-to-end suite against that build. Vercel's Git integration does the deploying (a preview per PR,
# production after merge).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fails on Cache Components mistakes too (e.g. an uncached new Date() in a prerendered page).
      - name: Build
        run: npm run build

      # End-to-end tests against the build just made (playwright.config.ts
      # starts `npm start`). CI has no secrets or services, so this also proves
      # every page degrades gracefully without them. Tests tagged @deployed
      # (Firewall, BotID, live data) only run against a deployment.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
